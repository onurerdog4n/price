<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ürün Karşılaştırma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="bg-gray-100">
    <div class="container mx-auto p-4">
      <div class="flex flex-col md:flex-row">
        <!-- Fixed left side container -->
        <div class="flex-none w-full md:w-auto">
          <!-- Fixed header for Product Info and SKU Lowest -->
          <div id="fixed-header" class="flex mb-4 bg-gray-100">
            <div class="w-full md:w-[300px] md:min-w-[300px] flex-shrink-0 flex items-center justify-center p-2 mr-2">
              <img src="https://www.pt.com.tr/wp-content/uploads/2019/01/pt-bilgi-sistemleri-logo.png" alt="PT" class="h-8">
            </div>
            <div class="w-full md:w-[230px] md:min-w-[230px] flex-shrink-0 flex items-center justify-center p-2 mr-2">
              <div class="text-lg font-bold">SKU Lowest</div>
            </div>
          </div>
          
          <!-- Fixed Products left side container -->
          <div id="fixed-products-container" class="mb-4 md:mb-0">
            <!-- Product info and SKU lowest will be rendered here -->
          </div>
        </div>
        
        <!-- Scrollable right side container -->
        <div class="flex-grow overflow-x-auto" id="stores-scroll-container">
          <!-- Scrollable header for stores -->
          <div id="scrollable-header" class="flex mb-4 bg-gray-100">
            <!-- Store headers will be added dynamically -->
          </div>
          
          <!-- Scrollable Products stores container -->
          <div id="scrollable-products-container">
            <!-- Store boxes will be rendered here -->
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
